[project]
name = "mind-lite"
version = "1.0.0"
description = "MIND-Lite v1.0: a bounded cognitive-agent prototype with immutable runtime state, deterministic Meta-Inference, and controlled LLM-assisted session admission."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nachuan Yan" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/Nigel886/MIND"
Documentation = "https://github.com/Nigel886/MIND/tree/main/docs"
