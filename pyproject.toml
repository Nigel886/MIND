[project]
name = "mind-lite"
version = "0.5.0.dev0"
description = "A specification-driven cognitive runtime, bounded Goal-Directed Agent, deterministic Meta-Inference layer, and local comparative-evaluation artifact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Nachuan Yan" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/Nigel886/MIND"
Documentation = "https://github.com/Nigel886/MIND/tree/main/docs"
